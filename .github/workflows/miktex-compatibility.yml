name: MiKTeX compatibility
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: miktex-compatibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    name: ${{ matrix.os }} / MiKTeX
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Choose disposable cloud storage
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'texquisite-miktex'
          New-Item -ItemType Directory -Path "$root/temporary","$root/artifacts" -Force | Out-Null
          "MIKTEX_TEST_ROOT=$root" >> $env:GITHUB_ENV
          "PERSISTENT_TEX_TEST_ARTIFACTS=$root/artifacts" >> $env:GITHUB_ENV
          "TEMP=$root/temporary" >> $env:GITHUB_ENV
          "TMP=$root/temporary" >> $env:GITHUB_ENV
          "npm_config_cache=$root/npm-cache" >> $env:GITHUB_ENV
      - run: npm ci --no-audit --no-fund
      - name: Build and check distribution selection guards
        shell: pwsh
        run: |
          npm run build
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node --test --test-concurrency=1 test/toolchain.test.cjs test/footer-navigation.test.cjs
          exit $LASTEXITCODE
      - name: Install isolated basic MiKTeX and required test packages
        shell: pwsh
        run: |
          & scripts/install-test-miktex.ps1 -WorkRoot "$env:MIKTEX_TEST_ROOT/installation"
          exit $LASTEXITCODE
      - name: Check native compilation, packages and two-way navigation
        run: node scripts/miktex-compatibility-test.cjs
      - name: Check source app editing, errors, export and restart
        run: node scripts/miktex-ui-test.cjs
      - name: Verify and extract the public 0.122 portable
        shell: pwsh
        run: |
          $exe=& scripts/prepare-portable-test.ps1 -WorkRoot "$env:MIKTEX_TEST_ROOT/published-package"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          "PERSISTENT_TEX_EXECUTABLE=$exe" >> $env:GITHUB_ENV
      - name: Check the published portable with MiKTeX
        run: node scripts/miktex-ui-test.cjs
      - name: Upload bounded compatibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: miktex-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ env.PERSISTENT_TEX_TEST_ARTIFACTS }}/**/result.json
            ${{ env.PERSISTENT_TEX_TEST_ARTIFACTS }}/**/failure.log
            ${{ env.MIKTEX_TEST_ROOT }}/installation/installation.json
            ${{ env.MIKTEX_TEST_ROOT }}/installation/setup.log
            ${{ env.MIKTEX_TEST_ROOT }}/published-package/portable-package.json
