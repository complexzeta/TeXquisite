name: Read-ahead compiler release compatibility
on:
  workflow_call:
permissions:
  contents: read
jobs:
  texlive:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: ['2024', '2025', '2026']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Choose isolated runner storage
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'read-ahead-release'
          New-Item -ItemType Directory -Path "$root/results","$root/temporary" -Force | Out-Null
          "COMPATIBILITY_ROOT=$root" >> $env:GITHUB_ENV
          "PERSISTENT_TEX_TEST_ARTIFACTS=$root/results" >> $env:GITHUB_ENV
          "PERSISTENT_TEX_TEST_FORMAT_CACHE=$root/formats" >> $env:GITHUB_ENV
          "PERSISTENT_TEX_TEST_RESOURCE_FILE=$root/formats/resources.json" >> $env:GITHUB_ENV
          "TEMP=$root/temporary" >> $env:GITHUB_ENV
          "TMP=$root/temporary" >> $env:GITHUB_ENV
          "npm_config_cache=$root/npm" >> $env:GITHUB_ENV
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test --test-concurrency=1 test/preamble-read-ahead.test.cjs test/document-root.test.cjs test/format-fingerprint.test.cjs test/format-cache.test.cjs test/format-preparation.test.cjs test/toolchain.test.cjs
      - name: Install the selected TeX Live
        shell: pwsh
        run: |
          & scripts/install-test-texlive.ps1 -Year '${{ matrix.year }}' -WorkRoot "$env:COMPATIBILITY_ROOT/installation"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $bin="$env:COMPATIBILITY_ROOT/installation/texlive/bin/windows"
          $bin >> $env:GITHUB_PATH
          "TEXQUISITE_TEST_TEX_BIN=$bin" >> $env:GITHUB_ENV
          "TEXQUISITE_TEST_TEX_YEAR=${{ matrix.year }}" >> $env:GITHUB_ENV
      - run: node scripts/texlive-compatibility-test.cjs
      - run: node scripts/retained-test-format.cjs
      - run: node scripts/preamble-read-ahead-probe.cjs
      - name: Package this candidate and verify its runtime assets
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $env:ELECTRON_BUILDER_CACHE="$env:COMPATIBILITY_ROOT/builder"
          node node_modules/electron-builder/out/cli/cli.js --win portable --publish never "--config.directories.output=$env:COMPATIBILITY_ROOT/package"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node scripts/verify-retained-package.cjs "$env:COMPATIBILITY_ROOT/package/win-unpacked/resources/app.asar"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          "PERSISTENT_TEX_EXECUTABLE=$env:COMPATIBILITY_ROOT/package/win-unpacked/TeXquisite.exe" >> $env:GITHUB_ENV
      - name: Packaged editing, saving, errors and restart on the selected TeX Live
        run: node scripts/texlive-compatibility-ui-test.cjs
      - name: Save bounded compatibility results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: read-ahead-texlive-${{ matrix.year }}
          retention-days: 7
          path: |
            ${{ env.PERSISTENT_TEX_TEST_ARTIFACTS }}/**/result.json
            ${{ env.PERSISTENT_TEX_TEST_ARTIFACTS }}/**/build.log
            ${{ env.PERSISTENT_TEX_TEST_FORMAT_CACHE }}/format-result.json
            ${{ env.COMPATIBILITY_ROOT }}/installation/installation.json
  miktex:
    uses: ./.github/workflows/miktex-compatibility.yml
    with:
      candidate: true
