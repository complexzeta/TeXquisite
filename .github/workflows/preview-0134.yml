name: Windows 0.137.0 test release
on:
  push:
    branches: [codex/preview-0.137.0]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test test/tex-completion.test.cjs test/tex-package-arguments.test.cjs test/recovery-supersession.test.cjs
      - run: node --test --test-name-pattern "TikZ and Forest|Forward flow windows" test/local-preview.test.cjs test/flow-window.test.cjs
      - name: Verify the generated window title
        shell: pwsh
        run: |
          $expected = '<title>TeXquisite 0.137.0 ' + [char]0x2014 + ' continuous scroll</title>'
          if (!(Get-Content -Raw -Encoding utf8 media/index.html).Contains($expected)) { throw 'Wrong window title' }
      - name: Build and verify the Windows portable package
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron-builder/out/cli/cli.js --win portable --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-retained-package.cjs release/win-unpacked/resources/app.asar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = 'TeXquisite-0.137.0-Windows.exe'
          $digest = (Get-FileHash -Algorithm SHA256 "release/$asset").Hash.ToLowerInvariant()
          "$digest  $asset" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Verify keyboard completion in the packaged editor
        shell: pwsh
        run: |
          $env:PERSISTENT_TEX_EXECUTABLE=(Resolve-Path 'release/win-unpacked/TeXquisite.exe').Path
          $env:PERSISTENT_TEX_TEST_ARTIFACTS=Join-Path $env:RUNNER_TEMP 'completion-results'
          node scripts/argument-completion-ui-test.cjs
          exit $LASTEXITCODE
      - name: Publish the Windows test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v0.137.0 release/TeXquisite-0.137.0-Windows.exe release/SHA256SUMS.txt --target "${{ github.sha }}" --title "TeXquisite 0.137.0 Windows test release" --prerelease --latest=false --notes-file .github/preview-0.137.0.md
