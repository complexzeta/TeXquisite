name: Windows 0.134 test release
on:
  push:
    branches: [codex/preview-0.134.0]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test test/recovery-supersession.test.cjs
      - run: node --test --test-name-pattern "TikZ and Forest|Forward flow windows" test/local-preview.test.cjs test/flow-window.test.cjs
      - name: Build and verify the Windows portable package
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron-builder/out/cli/cli.js --win portable --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-retained-package.cjs release/win-unpacked/resources/app.asar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = 'TeXquisite-0.134.0-Windows.exe'
          $digest = (Get-FileHash -Algorithm SHA256 "release/$asset").Hash.ToLowerInvariant()
          "$digest  $asset" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Publish the Windows test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v0.134.0 release/TeXquisite-0.134.0-Windows.exe release/SHA256SUMS.txt --target "${{ github.sha }}" --title "TeXquisite 0.134.0 Windows test release" --prerelease --latest=false --notes-file .github/preview-0.134.0.md
